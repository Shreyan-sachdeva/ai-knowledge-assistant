<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat — AI Knowledge Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background-color: #111;
            border-bottom: 1px solid #1a1a1a;
            padding: 15px 30px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        header h1 {
            color: #00ff88;
            font-size: 18px;
            letter-spacing: 1px;
        }

        header p {
            color: #555;
            font-size: 12px;
            margin-top: 3px;
        }

        header a {
            color: #888;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
        }

        header a:hover {
            color: #00ff88;
        }

        .chat-window {
            flex: 1;
            overflow-y: auto;
            padding: 30px;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .chat-window::-webkit-scrollbar {
            width: 4px;
        }

        .chat-window::-webkit-scrollbar-thumb {
            background-color: #2a2a2a;
            border-radius: 4px;
        }

        .message-row {
            display: flex;
            align-items: flex-end;
            gap: 10px;
        }

        .message-row.user {
            flex-direction: row-reverse;
        }

        .avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 14px;
            flex-shrink: 0;
        }

        .avatar.bot {
            background-color: #00ff88;
            color: #000;
        }

        .avatar.user {
            background-color: #2a2a2a;
            color: #fff;
        }

        .bubble {
            max-width: 65%;
            padding: 12px 16px;
            border-radius: 12px;
            font-size: 14px;
            line-height: 1.6;
        }

        .bubble.user {
            background-color: #00ff88;
            color: #000;
            border-bottom-right-radius: 3px;
        }

        .bubble.bot {
            background-color: #1a1a1a;
            color: #ddd;
            border: 1px solid #2a2a2a;
            border-bottom-left-radius: 3px;
        }

        .bubble.thinking {
            color: #555;
            font-style: italic;
        }

        .welcome-msg {
            text-align: center;
            color: #333;
            font-size: 14px;
            margin: auto;
            padding: 40px;
        }

        .welcome-msg span {
            color: #00ff88;
        }

        .input-area {
            background-color: #111;
            border-top: 1px solid #1a1a1a;
            padding: 15px 30px;
            display: flex;
            gap: 12px;
            align-items: center;
        }

        #questionInput {
            flex: 1;
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            padding: 12px 16px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: border-color 0.3s;
        }

        #questionInput:focus {
            border-color: #00ff88;
        }

        #questionInput::placeholder {
            color: #444;
        }

        #sendBtn {
            background-color: #00ff88;
            color: #000;
            border: none;
            border-radius: 8px;
            padding: 12px 20px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
            white-space: nowrap;
        }

        #sendBtn:hover {
            background-color: #00cc6a;
        }

        #sendBtn:disabled {
            background-color: #1a1a1a;
            color: #444;
            cursor: not-allowed;
        }
    </style>
</head>

<body>

    <header>
        <div>
            <h1>⚡ AI Knowledge Assistant</h1>
            <p>Ask questions from your uploaded documents</p>
        </div>
        <a href="index.html">← Admin Panel</a>
    </header>

    <div class="chat-window" id="chatWindow">
        <div class="welcome-msg">
            <p>👋 Hello! I'm your <span>AI Knowledge Assistant</span>.</p>
            <p style="margin-top:8px;">Ask me anything about your uploaded documents.</p>
        </div>
    </div>

    <div class="input-area">
        <input type="text" id="questionInput" placeholder="Ask a question about your documents...">
        <button id="sendBtn" onclick="sendMessage()">Send</button>
    </div>

    <script>
        const PYTHON_URL = 'https://ai-knowledge-assistant-python.onrender.com'
        const sessionId = 'session-' + Date.now()

        function addMessage(text, sender) {
            const chatWindow = document.getElementById('chatWindow')

            const welcomeMsg = chatWindow.querySelector('.welcome-msg')
            if (welcomeMsg) welcomeMsg.remove()

            const row = document.createElement('div')
            row.className = `message-row ${sender}`

            const avatar = document.createElement('div')
            avatar.className = `avatar ${sender}`
            avatar.textContent = sender === 'user' ? '👤' : '🤖'

            const bubble = document.createElement('div')
            bubble.className = `bubble ${sender}`
            bubble.textContent = text

            row.appendChild(avatar)
            row.appendChild(bubble)
            chatWindow.appendChild(row)

            chatWindow.scrollTop = chatWindow.scrollHeight
            return bubble
        }

        async function sendMessage() {
            const input = document.getElementById('questionInput')
            const question = input.value.trim()
            const sendBtn = document.getElementById('sendBtn')

            if (!question) return

            addMessage(question, 'user')
            input.value = ''
            sendBtn.disabled = true

            const thinkingBubble = addMessage('Thinking...', 'bot')
            thinkingBubble.classList.add('thinking')

            try {
                const response = await fetch(`${PYTHON_URL}/ask`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: question,
                        session_id: sessionId,
                        limit: 1
                    })
                })

                const data = await response.json()

                thinkingBubble.textContent = data.success
                    ? data.answer
                    : 'Sorry, something went wrong.'

                thinkingBubble.classList.remove('thinking')

            } catch (err) {
                thinkingBubble.textContent = 'Error: could not reach server.'
                thinkingBubble.classList.remove('thinking')
                console.error(err)
            }

            sendBtn.disabled = false
            input.focus()
        }

        document.getElementById('questionInput').addEventListener('keypress', function (e) {
            if (e.key === 'Enter') sendMessage()
        })
    </script>

</body>

</html>
