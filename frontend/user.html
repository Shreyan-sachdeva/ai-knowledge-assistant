<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Knowledge Assistant</title>
    <script>
        const CONFIG = {
            NODE_URL: 'https://ai-knowledge-assistant-node.onrender.com',
            PYTHON_URL: 'https://ai-knowledge-assistant-python.onrender.com'
        }
    </script>
    <style>
        body {
            font-family: Arial;
            background-color: #121212;
            display: flex;
            justify-content: center;
            padding: 20px;
        }

        .chat-container {
            width: 500px;
            background-color: #1e1e1e;
            border-radius: 10px;
            display: flex;
            flex-direction: column;
            height: 600px;
        }

        .chat-header {
            background-color: #4CAF50;
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
            font-size: 18px;
        }

        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
        }

        .message {
            padding: 10px;
            border-radius: 14px;
            margin: 6px;
        }

        .user-message {
            align-self: flex-end;
            background-color: #4CAF50;
            color: white;
        }

        .bot-message {
            align-self: flex-start;
            background-color: #2a2a2a;
            color: #eee;
        }

        .chat-input-area {
            display: flex;
            padding: 10px;
            border-top: 1px solid #2a2a2a;
        }

        #questionInput {
            flex: 1;
            padding: 10px;
            border: 1px solid #333;
            border-radius: 6px;
            margin-right: 8px;
        }

        #sendBtn {
            padding: 10px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        #sendBtn:disabled {
            background-color: #555;
            cursor: not-allowed;
        }

        .time-bubble {
            align-self: flex-start;
            background-color: #333;
            color: #aaa;
            font-size: 11px;
            padding: 3px 8px;
            border-radius: 10px;
            margin: -2px 0 6px 6px;
        }
    </style>
</head>

<body>
    <!--flex: 1 -> takes all the space available , padding space between inner content and boerder , flex-direction: coloumn -> stacks message vertically , overflo-w:auto -> adds scroll when too many messages , # -> used for id in css, -->
    <div class="chat-container">
        <div class="chat-header">AI Knowledge Assistant</div>

        <div class="chat-messages" id="chatMessages"></div>

        <div class="chat-input-area">
            <input type="text" id="questionInput" placeholder="Ask a question...">
            <button id="sendBtn" onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        function addMessage(text, sender, time = null) {
            const chatMessages = document.getElementById('chatMessages')
            const messageClass = sender === 'user' ? 'user-message' : 'bot-message'
            const messageDiv = document.createElement('div')
            messageDiv.className = 'message ' + messageClass
            messageDiv.textContent = text

            chatMessages.appendChild(messageDiv)
            if (time) {
                const timeBubble = document.createElement('div')
                timeBubble.className = 'time-bubble'
                timeBubble.textContent = `${time}s`
                chatMessages.appendChild(timeBubble)
            }
            return messageDiv

        }

        async function sendMessage() {
            const input = document.getElementById('questionInput')
            const question = input.value.trim()

            if (!question) {
                return
            }

            addMessage(question, 'user')
            input.value = ''

            const sendBtn = document.getElementById('sendBtn')
            sendBtn.disabled = true

            const thinkingMsg = addMessage('Thinking', 'bot')

            try {
                const response = await fetch(`${CONFIG.PYTHON_URL}/ask`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        question: question,
                        session_id: "demo",
                        limit: 3
                    })
                })

                const data = await response.json()

                thinkingMsg.remove()

                if (data.success) {
                    addMessage(data.answer, 'bot', data.timings.total)
                } else {
                    addMessage('Sorry, something went wrong.', 'bot')
                }

            } catch (err) {
                console.error(err)
                thinkingMsg.remove()
                addMessage('Error: could not reach server.', 'bot')
            }

            sendBtn.disabled = false
        }
    </script>

</body>

</html>
