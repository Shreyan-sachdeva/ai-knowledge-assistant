<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin — AI Knowledge Assistant</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #0d0d0d;
            color: #ffffff;
            font-family: Arial, sans-serif;
            min-height: 100vh;
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
            border-bottom: 1px solid #1a1a1a;
            padding-bottom: 20px;
        }

        header h1 {
            color: #00ff88;
            font-size: 28px;
            letter-spacing: 2px;
        }

        header p {
            color: #888;
            margin-top: 6px;
            font-size: 14px;
        }

        .container {
            max-width: 700px;
            margin: 0 auto;
        }

        .card {
            background-color: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 10px;
            padding: 25px;
            margin-bottom: 25px;
        }

        .card h2 {
            color: #00ff88;
            font-size: 16px;
            letter-spacing: 1px;
            margin-bottom: 20px;
            text-transform: uppercase;
        }

        .upload-area {
            border: 2px dashed #2a2a2a;
            border-radius: 8px;
            padding: 30px;
            text-align: center;
            margin-bottom: 15px;
            transition: border-color 0.3s;
        }

        .upload-area:hover {
            border-color: #00ff88;
        }

        .upload-area p {
            color: #888;
            font-size: 14px;
            margin-bottom: 12px;
        }

        input[type="file"] {
            display: none;
        }

        .file-label {
            background-color: #1a1a1a;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 8px 20px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
            transition: all 0.3s;
        }

        .file-label:hover {
            background-color: #00ff88;
            color: #000;
        }

        #selectedFile {
            color: #888;
            font-size: 13px;
            margin-top: 10px;
        }

        button {
            background-color: #00cc6a;
            color: #000;
        }

        button:hover {
            background-color: #00aa55;
        }

        button:disabled {
            background-color: #2a2a2a;
            color: #555;
            cursor: not-allowed;
        }

        #uploadStatus {
            text-align: center;
            font-size: 13px;
            margin-top: 10px;
            min-height: 20px;
        }

        .status-success {
            color: #00ff88;
        }

        .status-error {
            color: #ff4444;
        }

        .status-loading {
            color: #888;
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        thead tr {
            background-color: #111;
        }

        th {
            text-align: left;
            padding: 12px;
            color: #00ff88;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
            border-bottom: 1px solid #2a2a2a;
        }

        td {
            padding: 12px;
            color: #ccc;
            font-size: 13px;
            border-bottom: 1px solid #1e1e1e;
        }

        tr:hover td {
            background-color: #1e1e1e;
        }

        .delete-btn {
            width: auto;
            padding: 5px 12px;
            background-color: transparent;
            border: 1px solid #ff4444;
            color: #ff4444;
            border-radius: 4px;
            font-size: 12px;
            font-weight: normal;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 0;
        }

        .delete-btn:hover {
            background-color: #ff4444;
            color: #fff;
        }

        .empty-state {
            text-align: center;
            color: #555;
            padding: 30px;
            font-size: 14px;
        }

        .chat-btn {
            display: block;
            text-align: center;
            background-color: transparent;
            border: 1px solid #00ff88;
            color: #00ff88;
            padding: 12px;
            border-radius: 6px;
            text-decoration: none;
            font-size: 15px;
            font-weight: bold;
            transition: all 0.3s;
            margin-top: 10px;
        }

        .chat-btn:hover {
            background-color: #00ff88;
            color: #000;
        }
    </style>
</head>

<body>

    <header>
        <h1>⚡ AI Knowledge Assistant</h1>
        <p>Admin Panel — Manage Documents</p>
    </header>

    <div class="container">

        <div class="card">
            <h2>Upload Document</h2>
            <div class="upload-area">
                <p>Select a PDF file to upload</p>
                <label class="file-label" for="pdfFile">Browse File</label>
                <input type="file" id="pdfFile" accept=".pdf">
                <p id="selectedFile">No file selected</p>
            </div>
            <button id="uploadBtn" onclick="uploadPDF()">Upload PDF</button>
            <p id="uploadStatus"></p>
        </div>

        <div class="card">
            <h2>Uploaded Documents</h2>
            <table>
                <thead>
                    <tr>
                        <th>#</th>
                        <th>Filename</th>
                        <th>Uploaded At</th>
                        <th>Action</th>
                    </tr>
                </thead>
                <tbody id="documentsTable">
                    <tr>
                        <td colspan="4" class="empty-state">
                            Loading documents...
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <a href="user.html" class="chat-btn">
            Go to Chat →
        </a>

    </div>

    <script>
        const NODE_URL = 'https://ai-knowledge-assistant-node.onrender.com'

        document.getElementById('pdfFile').addEventListener('change', function () {
            const fileName = this.files[0] ? this.files[0].name : 'No file selected'
            document.getElementById('selectedFile').textContent = fileName
        })

        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile')
            const file = fileInput.files[0]
            const uploadBtn = document.getElementById('uploadBtn')
            const uploadStatus = document.getElementById('uploadStatus')

            if (!file) {
                setStatus(uploadStatus, 'Please select a PDF file!', 'error')
                return
            }

            const formData = new FormData()
            formData.append('pdf', file)

            uploadBtn.disabled = true
            setStatus(uploadStatus, 'Uploading and processing...', 'loading')

            try {
                const response = await fetch(`${NODE_URL}/api/upload`, {
                    method: 'POST',
                    body: formData
                })

                const data = await response.json()

                if (data.success) {
                    setStatus(uploadStatus, `✓ ${data.document.filename} uploaded!`, 'success')
                    fileInput.value = ''
                    document.getElementById('selectedFile').textContent = 'No file selected'
                    getDocuments()
                } else {
                    setStatus(uploadStatus, '✗ Upload failed. Try again.', 'error')
                }

            } catch (err) {
                setStatus(uploadStatus, '✗ Error connecting to server.', 'error')
                console.error(err)
            }

            uploadBtn.disabled = false
        }

        async function deleteDocument(id) {
            try {
                const response = await fetch(`${NODE_URL}/api/documents/${id}`, {
                    method: 'DELETE'
                })
                const data = await response.json()
                if (data.success) {
                    getDocuments()
                }
            } catch (err) {
                console.error(err)
            }
        }

        async function getDocuments() {
            const tbody = document.getElementById('documentsTable')

            // show loading with timeout warning
            tbody.innerHTML = `
        <tr>
            <td colspan="4" class="empty-state">
                Loading... (may take up to 60s on first load)
            </td>
        </tr>
    `

            try {
                const response = await fetch(`${NODE_URL}/api/documents`)
                const data = await response.json()

                if (data.documents.length === 0) {
                    tbody.innerHTML = `
                <tr>
                    <td colspan="4" class="empty-state">
                        No documents uploaded yet.
                    </td>
                </tr>
            `
                    return
                }

                tbody.innerHTML = ''
                data.documents.forEach((doc, index) => {
                    const date = new Date(doc.uploaded_at).toLocaleString()
                    tbody.innerHTML += `
                <tr>
                    <td>${index + 1}</td>
                    <td>${doc.filename}</td>
                    <td>${date}</td>
                    <td>
                        <button class="delete-btn"
                            onclick="deleteDocument(${doc.id})">
                            Delete
                        </button>
                    </td>
                </tr>
            `
                })

            } catch (err) {
                tbody.innerHTML = `
            <tr>
                <td colspan="4" class="empty-state" style="color:#ff4444">
                    ✗ Failed to connect. Check if server is running.
                </td>
            </tr>
        `
                console.error(err)
            }
        }

        function setStatus(element, message, type) {
            element.textContent = message
            element.className = `status-${type}`
        }

        getDocuments()
    </script>

</body>

</html>
