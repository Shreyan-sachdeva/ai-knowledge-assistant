<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin-Ai-Knowledge-Assistant</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            font-family: Arial, ;
            background-color: #f0f0f0;
        }

        .container {
            width: 500px;
            padding: 30px;
        }

        .section {
            background-color: white;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: #333;
        }

        input[type="file"] {
            display: block;
            margin: 10px 0;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 10px;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #ddd;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="section">
            <h2>Upload Documents</h2>
            <input type="file" name="file" id="pdfFile">
            <button type="submit" onclick="uploadPDF()">Upload</button>
        </div>
        <div class="section">
            <h2>Uploaded Documents</h2>
            <table>
                <tr>
                    <th>S.No.</th>
                    <th>FileName</th>
                    <th>Uploaded At</th>
                    <th>Action</th>
                </tr>
                <tbody id="documentsTable">
                </tbody>
            </table>
        </div>
    </div>
    <script>
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile')
            const file = fileInput.files[0]

            const formData = new FormData()
            formData.append('pdf', file)
            try {
                const response = await fetch('http://localhost:3000/api/upload', {
                    method: 'POST',
                    body: formData
                })

                fileInput.value = ''
                getDocuments()
            } catch (err) {
                console.error(err)
            }
        }

        async function getDocuments() {
            const tbody = document.getElementById('documentsTable')
            try {
                const response = await fetch('http://localhost:3000/api/documents')
                const data = await response.json()
                tbody.innerHTML = ''
                data.documents.forEach((doc, index) => {
                    const date = new Date(doc.uploaded_at).toLocaleString()
                    const row = `
                <tr>
                    <td>${index + 1}</td>
                    <td>${doc.filename}</td>
                    <td>${date}</td>
                    <td><button onclick="deleteDocument(${doc.id})">Delete</button></td>                    
                </tr>
            `
                    tbody.innerHTML += row
                })
            } catch (err) {
                console.error(err)
            }
        }
        async function deleteDocument(id) {
            try {
                const response = await fetch(`http://localhost:3000/api/documents/${id}`, {
                    method: 'DELETE'
                })

                const data = await response.json()

                if (data.success) {
                    getDocuments()
                }

            } catch (err) {
                console.error(err)
            }
        }
        getDocuments()
    </script>
</body>

</html>
