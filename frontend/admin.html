<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin-Ai-Knowledge-Assistant</title>
    <script src="config.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            font-family: Arial, ;
            background-color: #121212;
        }

        .container {
            width: 500px;
            padding: 30px;
        }

        .section {
            background-color: #1e1e1e;
            border-radius: 8px;
            padding: 20px;
            margin-bottom: 20px;
        }

        h2 {
            margin-top: 0;
            color: #f0f0f0;
        }

        input[type="file"] {
            display: block;
            margin: 10px 0;
        }

        button {
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 10px;
            border-radius: 6px;
            cursor: pointer;
        }

        table {
            width: 100%;
            margin-top: 10px;
        }

        th,
        td {
            text-align: left;
            padding: 8px;
            border-bottom: 1px solid #2a2a2a;
        }

        th {
            background-color: #4CAF50;
            color: white;
        }

        .nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .nav-buttons {
            display: flex;
            gap: 10px;
        }

        .chat-btn {
            background-color: #1976D2;
        }

        .chat-btn:hover {
            background-color: #1565C0;
        }

        .logout-btn {
            background-color: #e53935;
        }

        .logout-btn:hover {
            background-color: #b71c1c;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="nav">
            <h1>Admin Panel</h1>
            <div class="nav-buttons">
                <button class="chat-btn" onclick="window.location.href='user.html'">Go to Chat</button>
                <button class="logout-btn"
                    onclick="localStorage.removeItem('token'); localStorage.removeItem('role'); window.location.href='index.html'">Logout</button>
            </div>
        </div>
        <div class="section">
            <h2>Upload Documents</h2>
            <input type="file" name="file" id="pdfFile">
            <button type="submit" onclick="uploadPDF()">Upload</button>
        </div>
        <div class="section">
            <h2>Uploaded Documents</h2>
            <table>
                <tr>
                    <th>S.No.</th>
                    <th>FileName</th>
                    <th>Uploaded At</th>
                    <th>Action</th>
                </tr>
                <tbody id="documentsTable">
                </tbody>
            </table>
        </div>
    </div>
    <script>
        function getToken() {
            return localStorage.getItem('token')
        }

        if (!getToken()) {
            window.location.href = 'index.html'
        }
        async function uploadPDF() {
            const fileInput = document.getElementById('pdfFile')
            const file = fileInput.files[0]

            const formData = new FormData()
            formData.append('pdf', file)
            try {
                const response = await fetch(`${CONFIG.NODE_URL}/api/upload`, {
                    method: 'POST',
                    headers: {
                        'Authorization': 'Bearer ' + getToken()
                    },
                    body: formData
                })
                fileInput.value = ''
                getDocuments()
            } catch (err) {
                console.error(err)
            }
        }

        async function getDocuments() {
            const tbody = document.getElementById('documentsTable')
            try {
                const response = await fetch(`${CONFIG.NODE_URL}/api/documents`, {
                    headers: {
                        'Authorization': 'Bearer ' + getToken()
                    }
                })
                const data = await response.json()
                tbody.innerHTML = ''
                data.documents.forEach((doc, index) => {
                    const date = new Date(doc.uploaded_at).toLocaleString()
                    const row = `
                <tr>
                    <td>${index + 1}</td>
                    <td>${doc.filename}</td>
                    <td>${date}</td>
                    <td><button onclick="deleteDocument(${doc.id})">Delete</button></td>                    
                </tr>
            `
                    tbody.innerHTML += row
                })
            } catch (err) {
                console.error(err)
            }
        }
        async function deleteDocument(id) {
            try {
                const response = await fetch(`${CONFIG.NODE_URL}/api/documents/${id}`, {
                    method: 'DELETE',
                    headers: {
                        'Authorization': 'Bearer ' + getToken()
                    }
                })

                const data = await response.json()

                if (data.success) {
                    getDocuments()
                }

            } catch (err) {
                console.error(err)
            }
        }
        getDocuments()
    </script>
</body>

</html>
